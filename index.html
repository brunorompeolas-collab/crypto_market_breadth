<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MaxHapp - Ubicación & Pizarra Privada</title>

  <!-- Leaflet CSS (Mapa Oscuro y Liviano) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-card-hover: #1e293b;
      --border-color: #26334d;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --secondary: #c084fc;
      --secondary-glow: rgba(192, 132, 252, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; color: var(--text-main); display: flex; justify-content: center; align-items: center; }

    /* CONTENEDOR TIPO MÓVIL (para PC, Android e iOS) */
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-main);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .app-container {
        height: 92vh;
        max-height: 880px;
        border-radius: 36px;
        border: 2px solid var(--border-color);
      }
    }

    /* 1. PANTALLA PIN DE SEGURIDAD */
    .screen-pin {
      position: absolute;
      inset: 0;
      z-index: 1000;
      background: #070a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .screen-pin.unlocked {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.05);
    }
    
    .pin-icon {
      width: 52px; height: 52px; border-radius: 18px; background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3); display: flex; justify-content: center; align-items: center;
      font-size: 24px; margin-bottom: 12px; color: var(--primary);
    }
    .pin-title { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .pin-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

    /* CAMPO NOMBRE DE USUARIO */
    .username-input-box {
      width: 100%; max-width: 280px; margin-bottom: 20px;
    }
    .username-input-box label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
    .username-input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px;
      padding: 10px 14px; color: #fff; font-size: 14px; font-weight: 600; text-align: center; outline: none;
    }
    .username-input:focus { border-color: var(--primary); }

    .pin-dots { display: flex; gap: 16px; margin-bottom: 28px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-color); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .dot.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 14px var(--primary-glow); transform: scale(1.15); }
    
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
    .key-btn {
      width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-card);
      color: var(--text-main); font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600; cursor: pointer;
      display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: all 0.15s ease;
      user-select: none;
    }
    .key-btn:active { background: var(--border-color); transform: scale(0.92); border-color: var(--primary); }
    .pin-error { color: var(--error); font-size: 13px; height: 20px; margin-top: 14px; font-weight: 500; text-align: center; }

    /* 2. CABECERA DE LA APP */
    header {
      height: 68px;
      background: #070a12;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }
    .header-user { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #0284c7); display: flex; justify-content: center; align-items: center; font-weight: 700; color: #070a12; font-family: 'Outfit', sans-serif; }
    .status-text { font-size: 14px; font-weight: 600; line-height: 1.2; }
    .status-sub { font-size: 11px; color: var(--success); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
    .lock-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-muted); width: 38px; height: 38px; border-radius: 12px; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
    .lock-btn:hover { color: var(--text-main); border-color: var(--primary); }

    /* 3. CONTENIDO PRINCIPAL */
    .main-content { flex: 1; position: relative; overflow: hidden; background: var(--bg-main); }

    /* SECCIÓN MAPA */
    #map-view { width: 100%; height: 100%; position: relative; }
    .map-controls {
      position: absolute; bottom: 20px; right: 20px; z-index: 400; display: flex; flex-direction: column; gap: 10px;
    }
    .map-btn {
      width: 46px; height: 46px; border-radius: 14px; background: rgba(15, 23, 42, 0.9); color: var(--primary); border: 1px solid var(--border-color);
      font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(8px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.4); transition: all 0.2s ease;
    }
    .map-btn:active { transform: scale(0.92); }

    /* SECCIÓN PIZARRA */
    #board-view {
      width: 100%; height: 100%; background: var(--bg-main); flex-direction: column; display: none; padding: 18px;
    }
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .board-title { font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .board-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }

    .notes-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
    .notes-list::-webkit-scrollbar { width: 4px; }
    .notes-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    
    .note-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px 16px; position: relative;
      animation: fadeIn 0.25s ease-out forwards; display: flex; flex-direction: column; gap: 8px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .note-card.me { border-left: 4px solid var(--primary); }
    .note-card.other { border-left: 4px solid var(--secondary); }
    .note-author { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .note-text { font-size: 14px; color: var(--text-main); line-height: 1.45; word-break: break-word; }
    
    /* ADJUNTOS (IMÁGENES Y ARCHIVOS) */
    .note-attachment { margin-top: 4px; border-radius: 12px; overflow: hidden; }
    .note-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; }
    .note-img:hover { transform: scale(1.01); }
    
    .file-badge {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color); border-radius: 12px; text-decoration: none; color: var(--text-main); transition: all 0.2s;
    }
    .file-badge:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.08); }
    .file-icon { font-size: 22px; color: var(--primary); }
    .file-info { display: flex; flex-direction: column; overflow: hidden; }
    .file-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 11px; color: var(--text-muted); }

    /* BARRA DE ENTRADA Y ARCHIVOS PENDIENTES */
    .pending-file-preview {
      display: none; align-items: center; justify-content: space-between; padding: 8px 14px;
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; margin-top: 10px; font-size: 12px; color: var(--primary);
    }
    .pending-file-preview.active { display: flex; }
    .remove-pending-btn { background: none; border: none; color: var(--error); font-size: 16px; cursor: pointer; }

    .board-input-area { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .attach-btn {
      width: 44px; height: 44px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-muted); font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s;
    }
    .attach-btn:hover { color: var(--primary); border-color: var(--primary); }

    .board-input {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .board-input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 14px; background: var(--primary); border: none; color: #070a12; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s ease;
    }
    .send-btn:active { transform: scale(0.92); }

    /* LIGHTBOX VISOR DE IMÁGENES */
    .lightbox-modal {
      position: absolute; inset: 0; z-index: 2000; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.25s ease;
    }
    .lightbox-modal.active { display: flex; opacity: 1; }
    .lightbox-img { max-width: 100%; max-height: 80vh; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .lightbox-close { position: absolute; top: 20px; right: 20px; font-size: 28px; color: #fff; background: none; border: none; cursor: pointer; }

    /* 4. BARRA DE NAVEGACIÓN INFERIOR (PESTAÑAS) */
    nav {
      height: 70px; background: #070a12; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 500; cursor: pointer; width: 50%; height: 100%; justify-content: center; transition: all 0.2s ease;
    }
    .nav-tab.active { color: var(--primary); font-weight: 600; }
    .nav-tab.active .nav-icon { transform: translateY(-2px); }
    .nav-icon { font-size: 22px; transition: transform 0.2s ease; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- LIGHTBOX MODAL PARA IMÁGENES -->
  <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img src="" id="lightboxImg" class="lightbox-img" alt="Vista previa">
  </div>

  <!-- PANTALLA BLOQUEO POR PIN (PIN demo: 1234) -->
  <div class="screen-pin" id="pinScreen">
    <div class="pin-icon">🔒</div>
    <div class="pin-title">MaxHapp Privado</div>
    <div class="pin-subtitle">Escribe tu nombre e introduce el PIN (Demo: 1234)</div>

    <!-- Campo Nombre de Usuario (Recuerda este dispositivo) -->
    <div class="username-input-box">
      <label>Tu Nombre / Dispositivo:</label>
      <input type="text" id="usernameInput" class="username-input" placeholder="Ej: Papá, Mamá, Juan..." maxlength="15">
    </div>

    <div class="pin-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn" style="visibility:hidden"></button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn" onclick="deleteKey()">⌫</button>
    </div>
    <div class="pin-error" id="pinError"></div>
  </div>

  <!-- CABECERA -->
  <header>
    <div class="header-user">
      <div class="avatar" id="headerAvatar">U</div>
      <div>
        <div class="status-text" id="headerName">Usuario</div>
        <div class="status-sub"><span class="status-dot"></span> En línea (Firebase GPS)</div>
      </div>
    </div>
    <button class="lock-btn" onclick="lockApp()" title="Bloquear aplicación">🔒</button>
  </header>

  <!-- CONTENIDO VISTA PESTAÑAS -->
  <div class="main-content">
    <!-- Pestaña 1: Mapa -->
    <div id="map-view">
      <div class="map-controls">
        <button class="map-btn" onclick="centerMap('me')" title="Mi posición GPS">🎯</button>
        <button class="map-btn" onclick="centerMap('all')" title="Ver a todos los usuarios">👥</button>
      </div>
    </div>

    <!-- Pestaña 2: Pizarra -->
    <div id="board-view">
      <div class="board-header">
        <div class="board-title">Pizarra Compartida 📝</div>
        <div class="board-badge" id="syncStatus">Firebase Activo</div>
      </div>
      <div class="notes-list" id="notesList">
        <!-- Las notas se insertan dinámicamente -->
      </div>

      <!-- Previsualización de Archivo Adjunto -->
      <div class="pending-file-preview" id="pendingFilePreview">
        <span id="pendingFileName">📎 Archivo preparado</span>
        <button class="remove-pending-btn" onclick="clearPendingFile()">✕</button>
      </div>

      <!-- Barra de entrada con adjuntos -->
      <div class="board-input-area">
        <button class="attach-btn" onclick="triggerFileInput()" title="Adjuntar foto o archivo">📎</button>
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)" accept="image/*,.pdf,.doc,.docx,.txt">
        
        <input type="text" id="noteInput" class="board-input" placeholder="Escribe una nota o adjunta un archivo..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="addNote()">➔</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav>
    <button class="nav-tab active" id="tabMapBtn" onclick="switchTab('map')">
      <span class="nav-icon">🗺️</span>
      <span>Mapa</span>
    </button>
    <button class="nav-tab" id="tabBoardBtn" onclick="switchTab('board')">
      <span class="nav-icon">📝</span>
      <span>Pizarra</span>
    </button>
  </nav>

</div>

<!-- Leaflet JS (Mapa) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase Web SDK Compat v10 -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  // CONFIGURACIÓN DE FIREBASE (Proyecto 366839044898)
  const firebaseConfig = {
    apiKey: "AIzaSy_MAXHAPP_DEMO_KEY",
    authDomain: "maxhapp-366839044898.firebaseapp.com",
    projectId: "maxhapp-366839044898",
    storageBucket: "maxhapp-366839044898.appspot.com",
    messagingSenderId: "366839044898",
    appId: "1:366839044898:web:maxhapp"
  };

  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch(e) {
    console.log("Firebase local mode:", e);
  }

  // USUARIO & DISPOSITIVO (Guarda en localStorage de cada teléfono Android / iOS)
  const CORRECT_PIN = "1234";
  let enteredPin = "";
  
  // Generar ID único para este dispositivo si no existe
  let myDeviceId = localStorage.getItem("maxhapp_device_id");
  if (!myDeviceId) {
    myDeviceId = "dev_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("maxhapp_device_id", myDeviceId);
  }

  let myUserName = localStorage.getItem("maxhapp_user_name") || "";

  // Cargar nombre en input si ya existía
  document.addEventListener("DOMContentLoaded", () => {
    if (myUserName) {
      document.getElementById('usernameInput').value = myUserName;
    }
  });

  function saveCurrentUserName() {
    const inputVal = document.getElementById('usernameInput').value.trim();
    if (inputVal) {
      myUserName = inputVal;
      localStorage.setItem("maxhapp_user_name", myUserName);
    } else {
      myUserName = "Usuario_" + myDeviceId.substr(4, 4);
    }
    
    document.getElementById('headerName').innerText = myUserName;
    document.getElementById('headerAvatar').innerText = myUserName.charAt(0).toUpperCase();
  }

  function pressKey(num) {
    if (enteredPin.length < 4) {
      enteredPin += num;
      updatePinDots();
      if (enteredPin.length === 4) {
        setTimeout(verifyPin, 150);
      }
    }
  }

  function deleteKey() {
    enteredPin = enteredPin.slice(0, -1);
    updatePinDots();
    document.getElementById('pinError').innerText = "";
  }

  function updatePinDots() {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, index) => {
      if (index < enteredPin.length) dot.classList.add('active');
      else dot.classList.remove('active');
    });
  }

  function verifyPin() {
    if (enteredPin === CORRECT_PIN) {
      saveCurrentUserName();
      const pinScreen = document.getElementById('pinScreen');
      pinScreen.classList.add('unlocked');
      setTimeout(() => { pinScreen.style.display = 'none'; }, 300);
      enteredPin = "";
      updatePinDots();
      initMap();
      listenRealtimeNotes();
      startGPSWatch();
    } else {
      document.getElementById('pinError').innerText = "PIN incorrecto. Prueba con '1234'";
      enteredPin = "";
      updatePinDots();
    }
  }

  function lockApp() {
    const pinScreen = document.getElementById('pinScreen');
    pinScreen.style.display = 'flex';
    setTimeout(() => { pinScreen.classList.remove('unlocked'); }, 10);
  }

  // NAVEGACIÓN ENTRE PESTAÑAS
  function switchTab(tab) {
    const mapView = document.getElementById('map-view');
    const boardView = document.getElementById('board-view');
    const tabMapBtn = document.getElementById('tabMapBtn');
    const tabBoardBtn = document.getElementById('tabBoardBtn');

    if (tab === 'map') {
      mapView.style.display = 'block';
      boardView.style.display = 'none';
      tabMapBtn.classList.add('active');
      tabBoardBtn.classList.remove('active');
      if (map) map.invalidateSize();
    } else {
      mapView.style.display = 'none';
      boardView.style.display = 'flex';
      tabMapBtn.classList.remove('active');
      tabBoardBtn.classList.add('active');
    }
  }

  // MAPA & GEOLOCALIZACIÓN MULTI-USUARIO (Android + iOS)
  let map;
  let userMarkers = {}; // { deviceId: L.Marker }
  let posMe = [40.416775, -3.703790]; // Madrid por defecto

  function initMap() {
    if (map) return;

    map = L.map('map-view', { zoomControl: false }).setView(posMe, 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; CartoDB & MaxHapp'
    }).addTo(map);

    // Escuchar ubicaciones GPS de TODOS los dispositivos conectados en Firebase
    if (db) {
      db.collection("locations").onSnapshot((snapshot) => {
        snapshot.forEach((doc) => {
          const devId = doc.id;
          const data = doc.data();

          if (data.lat && data.lng) {
            const isMe = (devId === myDeviceId);
            const color = isMe ? '#38bdf8' : '#c084fc';
            
            const customIcon = L.divIcon({
              html: `<div style="background:${color}; width:24px; height:24px; border-radius:50%; border:3px solid white; box-shadow: 0 0 14px ${color}; display:flex; justify-content:center; align-items:center; font-size:10px; font-weight:bold; color:#000;">${(data.name || 'U').charAt(0).toUpperCase()}</div>`,
              className: ''
            });

            if (!userMarkers[devId]) {
              userMarkers[devId] = L.marker([data.lat, data.lng], { icon: customIcon })
                .addTo(map)
                .bindPopup(`<b>${data.name || 'Usuario'}</b> ${isMe ? '(Tú)' : ''}`);
            } else {
              userMarkers[devId].setLatLng([data.lat, data.lng]);
            }
          }
        });
      });
    }
  }

  function startGPSWatch() {
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          posMe = [position.coords.latitude, position.coords.longitude];

          // Transmitir posición GPS propia a Firebase
          if (db) {
            db.collection("locations").doc(myDeviceId).set({
              name: myUserName,
              lat: posMe[0],
              lng: posMe[1],
              updatedAt: new Date().toISOString()
            });
          }
        },
        (err) => console.log("GPS Activo: ", err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
      );
    }
  }

  function centerMap(who) {
    if (!map) return;
    if (who === 'me') {
      map.flyTo(posMe, 16, { duration: 1.2 });
      if (userMarkers[myDeviceId]) userMarkers[myDeviceId].openPopup();
    } else {
      // Centrar en todos los puntos
      const group = new L.featureGroup(Object.values(userMarkers));
      if (group.getLayers().length > 0) {
        map.fitBounds(group.getBounds().pad(0.2));
      }
    }
  }

  // PIZARRA COMPARTIDA MULTIDISPOSITIVO
  let currentFile = null;

  let defaultNotes = [
    { text: "¡Hola! He dejado las llaves en la entrada.", author: "Juan", isMe: false, time: "10:30 AM" },
    { text: "Perfecto, gracias. Paso a por ellas a la tarde.", author: "Tú", isMe: true, time: "10:32 AM" }
  ];

  function getStoredNotes() {
    try {
      const saved = localStorage.getItem("private_app_notes");
      return saved ? JSON.parse(saved) : defaultNotes;
    } catch(e) {
      return defaultNotes;
    }
  }

  function saveLocalNotes(notesArray) {
    try {
      localStorage.setItem("private_app_notes", JSON.stringify(notesArray));
    } catch(e) {}
  }

  function triggerFileInput() {
    document.getElementById('fileInput').click();
  }

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const sizeMb = (file.size / (1024 * 1024)).toFixed(2);
      const sizeStr = file.size > 1024 * 1024 ? `${sizeMb} MB` : `${Math.round(file.size / 1024)} KB`;

      currentFile = {
        name: file.name,
        type: file.type,
        isImage: file.type.startsWith('image/'),
        size: sizeStr,
        data: event.target.result
      };

      document.getElementById('pendingFileName').innerText = `📎 ${file.name} (${sizeStr})`;
      document.getElementById('pendingFilePreview').classList.add('active');
    };
    reader.readAsDataURL(file);
  }

  function clearPendingFile() {
    currentFile = null;
    document.getElementById('fileInput').value = "";
    document.getElementById('pendingFilePreview').classList.remove('active');
  }

  function listenRealtimeNotes() {
    if (db) {
      db.collection("notes").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
        const firebaseNotes = [];
        snapshot.forEach((doc) => {
          const d = doc.data();
          firebaseNotes.push({
            text: d.text,
            author: d.author,
            isMe: d.deviceId === myDeviceId,
            time: d.time,
            file: d.file || null
          });
        });

        if (firebaseNotes.length > 0) {
          renderNotesList(firebaseNotes);
          document.getElementById('syncStatus').innerText = "Firebase Sincronizado";
          return;
        }
      });
    }
    renderNotesList(getStoredNotes());
  }

  function renderNotesList(notesArray) {
    const list = document.getElementById('notesList');
    list.innerHTML = "";

    notesArray.forEach(note => {
      const card = document.createElement('div');
      card.className = `note-card ${note.isMe ? 'me' : 'other'}`;
      
      let attachmentHtml = "";
      if (note.file) {
        if (note.file.isImage) {
          attachmentHtml = `
            <div class="note-attachment">
              <img src="${note.file.data}" class="note-img" onclick="openLightbox('${note.file.data}')" alt="${note.file.name}">
            </div>
          `;
        } else {
          attachmentHtml = `
            <div class="note-attachment">
              <a href="${note.file.data}" download="${note.file.name}" class="file-badge">
                <span class="file-icon">📄</span>
                <div class="file-info">
                  <span class="file-name">${note.file.name}</span>
                  <span class="file-size">${note.file.size}</span>
                </div>
              </a>
            </div>
          `;
        }
      }

      card.innerHTML = `
        <div class="note-author">
          <span>${note.author}</span>
          <span>${note.time}</span>
        </div>
        ${note.text ? `<div class="note-text">${note.text}</div>` : ''}
        ${attachmentHtml}
      `;
      list.appendChild(card);
    });
    list.scrollTop = list.scrollHeight;
  }

  function addNote() {
    const input = document.getElementById('noteInput');
    const text = input.value.trim();

    if (!text && !currentFile) return;

    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const newNote = {
      text: text,
      author: myUserName || "Usuario",
      deviceId: myDeviceId,
      time: timeStr,
      file: currentFile ? { ...currentFile } : null,
      createdAt: firebase.firestore.FieldValue ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
    };

    if (db) {
      db.collection("notes").add(newNote).catch(err => console.log("Fallback a local: ", err));
    }

    const currentNotes = getStoredNotes();
    currentNotes.push({ ...newNote, isMe: true });
    saveLocalNotes(currentNotes);

    input.value = "";
    clearPendingFile();
    renderNotesList(currentNotes);
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') addNote();
  }

  // LIGHTBOX
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxModal').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightboxModal').classList.remove('active');
  }

  // Carga inicial
  renderNotesList(getStoredNotes());
</script>

</body>
</html>
